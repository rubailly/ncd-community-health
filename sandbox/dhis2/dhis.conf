# DHIS2 configuration for the local sandbox. The database is only reachable
# inside the compose network, so its credentials are fixed here.
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://dhis2-db:5432/dhis2
connection.username = dhis
connection.password = dhis

server.base.url = http://localhost:8081
system.audit.enabled = false
