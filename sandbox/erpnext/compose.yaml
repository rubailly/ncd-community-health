# E-Buzima (ERPNext + Healthcare). Modelled on frappe_docker's pwd.yml.
# One site (`ebuzima`) serves every health centre; each health centre is a
# Company (see docs/decisions/0004-identifiers-and-reference-data.md).

x-erpnext: &erpnext
  image: ncd/erpnext:v15.121.4-healthcare
  # Built locally by erpnext-backend; never pulled from a registry
  pull_policy: never
  restart: unless-stopped
  volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs

services:
  erpnext-backend:
    <<: *erpnext
    build: ./
    pull_policy: build
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -H 'Host: ebuzima' http://localhost:8000/api/method/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Writes common_site_config.json (DB and Redis hosts), then exits.
  erpnext-configurator:
    <<: *erpnext
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt &&
        bench set-config -g db_host erpnext-db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://erpnext-redis-cache:6379 &&
        bench set-config -g redis_queue redis://erpnext-redis-queue:6379 &&
        bench set-config -g redis_socketio redis://erpnext-redis-queue:6379 &&
        bench set-config -gp socketio_port 9000
    depends_on:
      erpnext-db:
        condition: service_healthy

  # Creates the site with ERPNext and Healthcare on first start; a no-op after.
  erpnext-create-site:
    <<: *erpnext
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ -d sites/ebuzima ]; then echo "site ebuzima already exists"; exit 0; fi;
        bench new-site ebuzima
        --mariadb-user-host-login-scope='%'
        --db-root-username root
        --db-root-password "$$DB_ROOT_PASSWORD"
        --admin-password "$$ADMIN_PASSWORD"
        --install-app erpnext
        --install-app healthcare
        --set-default
    environment:
      DB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started

  erpnext:
    <<: *erpnext
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ebuzima
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${ERPNEXT_PORT}:8080"
    depends_on:
      erpnext-backend:
        condition: service_healthy
      erpnext-websocket:
        condition: service_started
      erpnext-create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/method/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  erpnext-websocket:
    <<: *erpnext
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully

  erpnext-worker:
    <<: *erpnext
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully

  erpnext-scheduler:
    <<: *erpnext
    command: ["bench", "schedule"]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully

  erpnext-db:
    image: mariadb:10.6.21
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
    volumes:
      - erpnext-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  erpnext-redis-cache:
    image: redis:7.2.5-alpine
    restart: unless-stopped

  erpnext-redis-queue:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue-data:/data

volumes:
  erpnext-sites:
  erpnext-logs:
  erpnext-db-data:
  erpnext-redis-queue-data:
