# The OpenFn project. `make deploy` provisions it into the local Lightning.
#
# Conventions (read by tools/systems/openfn.js):
#   - `body` is a path to the step's code, relative to this file
#   - `credential` names a credential created by `make bootstrap`
#   - `from_to` connects a trigger or step to the next step
# Lightning project names are URL-safe: lowercase, digits and dashes
name: ncd-community-health
description: >-
  Refers community NCD screenings with high readings from OpenMRS to the
  health centre in E-Buzima, notifies the health centre and patient on
  WhatsApp, and reports monthly aggregates to DHIS2.

collections:
  - ncd-config   # reference data, loaded from reference-data/ by `make bootstrap`
  - ncd-state    # the workflow's cursor and last report time

workflows:
  ncd-referral-and-reporting:
    name: NCD Community Referral & Reporting
    triggers:
      every-15-minutes:
        type: cron
        cron_expression: '*/15 * * * *'
      webhook:
        type: webhook   # manual runs; the body can pass options (see step 1)
    jobs:
      load-config:
        name: 1. Load config & cursor
        adaptor: '@openfn/language-common@3.3.5'
        body: jobs/01-load-config.js
      fetch-screenings:
        name: 2. Fetch screenings (OpenMRS)
        adaptor: '@openfn/language-http@7.3.3'
        credential: OpenMRS
        body: jobs/02-fetch-screenings.js
      evaluate-and-route:
        name: 3. Evaluate & route
        adaptor: '@openfn/language-common@3.3.5'
        body: jobs/03-evaluate-and-route.js
      create-referrals:
        name: 4. Create referrals (E-Buzima)
        adaptor: '@openfn/language-http@7.3.3'
        credential: E-Buzima
        body: jobs/04-create-referrals.js
      notify:
        name: 5. Notify health centre & patient (WhatsApp)
        adaptor: '@openfn/language-http@7.3.3'
        credential: WhatsApp
        body: jobs/05-notify.js
      finish-referrals:
        name: 6. Record notifications & advance cursor
        adaptor: '@openfn/language-http@7.3.3'
        credential: E-Buzima
        body: jobs/06-finish-referrals.js
      fetch-period-screenings:
        name: 7. Fetch the month's screenings (OpenMRS)
        adaptor: '@openfn/language-http@7.3.3'
        credential: OpenMRS
        body: jobs/07-fetch-period-screenings.js
      fetch-period-referrals:
        name: 8. Fetch the month's referrals (E-Buzima)
        adaptor: '@openfn/language-http@7.3.3'
        credential: E-Buzima
        body: jobs/08-fetch-period-referrals.js
      build-report:
        name: 9. Build the DHIS2 report
        adaptor: '@openfn/language-common@3.3.5'
        body: jobs/09-build-report.js
      push-to-dhis2:
        name: 10. Push to DHIS2
        adaptor: '@openfn/language-http@7.3.3'
        credential: DHIS2
        body: jobs/10-push-to-dhis2.js
    edges:
      - from_to: every-15-minutes -> load-config
        condition: always
      - from_to: webhook -> load-config
        condition: always
      - from_to: load-config -> fetch-screenings
      - from_to: fetch-screenings -> evaluate-and-route
      - from_to: evaluate-and-route -> create-referrals
      - from_to: create-referrals -> notify
      - from_to: notify -> finish-referrals
      # Reporting branch: only when step 1 found a report due
      - from_to: load-config -> fetch-period-screenings
        condition: js_expression
        expression: state.reportPeriods.length > 0
        label: DHIS2 report due
      - from_to: fetch-period-screenings -> fetch-period-referrals
      - from_to: fetch-period-referrals -> build-report
      - from_to: build-report -> push-to-dhis2
